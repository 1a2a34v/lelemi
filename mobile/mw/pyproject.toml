[tool.briefcase]
project_name = "Hello World"
bundle = "com.example"
version = "0.0.1"
url = "https://example.com/mw"
license = "Other"
author = 'Jane Developer'
author_email = "jane@example.com"

[tool.briefcase.app.mw]
formal_name = "Hello World"
description = "ankianki"
icon = "src/mw/resources/mw"
sources = ['src/mw']
requires = []


[tool.briefcase.app.mw.macOS]
requires = [
    'toga-cocoa>=0.3.0.dev20',
]

[tool.briefcase.app.mw.linux]
requires = [
    'toga-gtk>=0.3.0.dev20',
]
system_requires = [
    'libgirepository1.0-dev',
    'libcairo2-dev',
    'libpango1.0-dev',
    'libwebkitgtk-3.0-0',
    'gir1.2-webkit-3.0',
]

[tool.briefcase.app.mw.windows]
requires = [
    'toga-winforms>=0.3.0.dev20',
]

# Mobile deployments
[tool.briefcase.app.mw.iOS]
requires = [
    'toga-iOS>=0.3.0.dev20',
]

[tool.briefcase.app.mw.android]
requires = [
    'toga-android>=0.3.0.dev20',
]
